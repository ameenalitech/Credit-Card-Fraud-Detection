[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "imbalanced-learn>=0.12.4",
    "ipykernel>=6.31.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.11",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "pytest>=8.4.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "streamlit>=1.50.0",
    "xgboost>=2.1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
]
